<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Title, description and link-preview tags live here (not in React)
         so LinkedIn, Slack and texts see them without running JavaScript. -->
    <title>Raymond Buckman</title>
    <meta name="description" content="Raymond Buckman — computer engineer and React developer. Projects, coursework, experience and interests." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://raymondbuckman.com/" />
    <meta property="og:title" content="Raymond Buckman" />
    <meta property="og:description" content="Computer engineer and React developer. Projects, coursework, experience and interests." />
    <meta property="og:image" content="https://raymondbuckman.com/images/subway.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raymond Buckman" />
    <meta name="twitter:description" content="Computer engineer and React developer." />
    <meta name="twitter:image" content="https://raymondbuckman.com/images/subway.jpg" />

    <meta name="theme-color" content="#0a0a0a" />
    <!-- Fonts are self-hosted (see src/fonts.css). Preload the graffiti font
         so the name in the hero appears in it straight away. -->
    <link rel="preload" href="/fonts/sedgwick-ave-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
